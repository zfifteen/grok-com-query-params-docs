<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parameters · Grok.com Query Parameter Field Guide</title>
  <meta name="description" content="Full catalog of grok.com query parameters tested in an authenticated session." />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%237c8cff'/%3E%3Cstop offset='1' stop-color='%233de0c5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="site-nav">
    <div class="wrap">
      <a class="brand" href="../index.html">
        <div class="brand-mark" aria-hidden="true"><span>G?</span></div>
        <span>Grok Params</span>
      </a>
      <nav aria-label="Primary">
        <ul class="nav-links">
          <li><a href="../index.html">Overview</a></li>
          <li><a href="parameters.html">Parameters</a></li>
          <li><a href="recipes.html">Recipes</a></li>
          <li><a href="methodology.html">Methodology</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="eyebrow"><span class="dot"></span> Full matrix</div>
        <h1>Parameter catalog</h1>
        <p>
          Every candidate tried on the live authenticated session.
          Filter by status or category. Copy any tested URL.
        </p>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="toolbar">
          <div class="search">
            <label class="sr-only" for="param-search">Search parameters</label>
            <input id="param-search" type="search" placeholder="Search name, effect, URL…" autocomplete="off" />
          </div>
          <div class="filter-chips" role="group" aria-label="Status filter">
            <button type="button" data-filter-type="status" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter-type="status" data-filter="works" aria-pressed="false">Works</button>
            <button type="button" data-filter-type="status" data-filter="partial" aria-pressed="false">Partial</button>
            <button type="button" data-filter-type="status" data-filter="unresolved" aria-pressed="false">Unresolved</button>
            <button type="button" data-filter-type="status" data-filter="noop" aria-pressed="false">No-op</button>
          </div>
        </div>
        <div class="toolbar">
          <div class="filter-chips" role="group" aria-label="Category filter">
            <button type="button" data-filter-type="category" data-filter="all" aria-pressed="true">All categories</button>
            <button type="button" data-filter-type="category" data-filter="prompt" aria-pressed="false">Prompt</button>
            <button type="button" data-filter-type="category" data-filter="mode" aria-pressed="false">Mode</button>
            <button type="button" data-filter-type="category" data-filter="privacy" aria-pressed="false">Privacy</button>
            <button type="button" data-filter-type="category" data-filter="routing" aria-pressed="false">Routing</button>
            <button type="button" data-filter-type="category" data-filter="attachments" aria-pressed="false">Attachments</button>
            <button type="button" data-filter-type="category" data-filter="misc" aria-pressed="false">Misc</button>
          </div>
          <span class="chip" data-result-count>—</span>
        </div>

        <p class="empty" data-load-error hidden></p>
        <div class="param-grid" data-param-list></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>Observation log · <span data-meta-date>2026-08-05</span></div>
      <div class="mono">data/findings.json</div>
    </div>
  </footer>

  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
